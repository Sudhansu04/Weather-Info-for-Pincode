spring:
  application:
    name: pincode-weather-api
  datasource:
    # File-based H2 so cached pincode/weather data survives restarts. Override with the "postgres" profile.
    url: jdbc:h2:file:./data/weatherdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

openweather:
  api-key: ff7f2c50860e28c12354ef48942009d0
  geocoding-base-url: https://api.openweathermap.org/geo/1.0
  weather-base-url: https://api.openweathermap.org/data/2.5
  units: metric
  connect-timeout: 5s
  read-timeout: 10s

weather:
  # ISO 3166 country code appended to pincodes for geocoding (Indian pincodes by default).
  default-country: IN
  # Zone used to decide what "today" is when comparing for_date.
  zone: Asia/Kolkata
  # A same-day weather record older than this is refreshed from OpenWeather. Past dates are never refreshed.
  same-day-refresh-after: 60m

logging:
  level:
    com.pincodeweather: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/weatherdb}
    username: ${DB_USERNAME:weather}
    password: ${DB_PASSWORD:weather}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
